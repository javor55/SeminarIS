name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # Jen pro build a testy v CI – žádná produkční data
  DATABASE_URL: postgresql://postgres:postgres@localhost:5432/seminaris_test
  NEXTAUTH_SECRET: ci-secret-not-for-production
  NEXTAUTH_URL: http://localhost:3000
  NEXT_TELEMETRY_DISABLED: "1"
  # E-maily se v testech neodesílají, jen zapisují do logu
  EMAIL_TRANSPORT: log
  EMAIL_FROM: "Školní IS <test@example.com>"
  # Test endpointu /api/cron/daily
  CRON_SECRET: ci-cron-secret-not-for-production

jobs:
  checks:
    name: Typecheck, lint, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run build

  e2e:
    name: E2E testy (Playwright + PostgreSQL)
    runs-on: ubuntu-latest
    needs: checks
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: seminaris_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Prohlížeč pro Playwright
        run: npx playwright install --with-deps chromium
      - name: Migrace testovací databáze
        run: npm run db:migrate
      - run: npm run build
      - name: E2E testy
        run: npm run test:e2e
      - name: Report při selhání
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
